name: ci

on:
  workflow_dispatch:
    inputs:
      version:
        description: "build version"
        required: true
        default: "1.0.83"
      variant:
        description: "variant: ia (personal, with the AI mode) or public (no AI mode)"
        required: false
        default: "ia"
      ref:
        description: "source ref; empty uses the SOURCE_REF secret"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ inputs.ref != '' && inputs.ref || secrets.SOURCE_REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Build
        env:
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_VARIANT: ${{ inputs.variant }}
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BT3_BUILD_KEY: ${{ secrets.BT3_BUILD_KEY }}
        run: bash source/.ci/public_build.sh
